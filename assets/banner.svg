<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Radar Radial Gradient -->
    <radialGradient id="radar-sweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes radar-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes plane-fly {
      0% { transform: translate(-50px, 40px) scale(0.8); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translate(420px, -110px) scale(1.1); opacity: 0; }
    }
    @keyframes pulse-ring {
      0% { r: 40px; opacity: 0.8; }
      100% { r: 120px; opacity: 0; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes blip-fade {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Element Styling */
    .bg { fill: url(#bg-grad); }
    .radar-line { stroke: #38bdf8; stroke-opacity: 0.25; stroke-width: 1; }
    .radar-sweep-sector {
      transform-origin: 950px 180px;
      animation: radar-rotate 8s linear infinite;
    }
    .plane-path {
      animation: plane-fly 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pulse-circle {
      animation: pulse-ring 4s ease-out infinite;
    }
    .floating-card {
      animation: float-badge 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float-badge 6s ease-in-out infinite 1.5s;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash-flow 3s linear infinite;
    }
    .blip {
      animation: blip-fade 2s ease-in-out infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
      font-size: 18px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      fill: #e2e8f0;
      font-size: 13px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" class="bg"/>

  <!-- Grid Overlay -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Right Side: Animated Radar Display Background (behind text layer) -->
  <g transform="translate(0,0)">
    <!-- Concentric Radar Rings -->
    <circle cx="950" cy="180" r="130" class="radar-line" />
    <circle cx="950" cy="180" r="90" class="radar-line" />
    <circle cx="950" cy="180" r="50" class="radar-line" />
    <circle cx="950" cy="180" r="130" stroke="#38bdf8" stroke-opacity="0.15" fill="none" class="pulse-circle"/>

    <!-- Radar Crosshairs -->
    <line x1="820" y1="180" x2="1080" y2="180" class="radar-line" />
    <line x1="950" y1="50" x2="950" y2="310" class="radar-line" />

    <!-- Rotating Sweep Sector -->
    <g class="radar-sweep-sector">
      <path d="M 950 180 L 1080 180 A 130 130 0 0 0 950 50 Z" fill="url(#radar-sweep)" />
      <line x1="950" y1="180" x2="1080" y2="180" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
    </g>

    <!-- Radar Target Blips -->
    <circle cx="990" cy="130" r="4" fill="#38bdf8" class="blip" />
    <circle cx="910" cy="220" r="3" fill="#818cf8" class="blip" style="animation-delay: 0.7s;" />
    <circle cx="1030" cy="210" r="5" fill="#34d399" class="blip" style="animation-delay: 1.2s;" />
  </g>

  <!-- Animated Flight Path & Airplane Silhouette (Background accent) -->
  <g transform="translate(680, 160)">
    <path d="M -50 40 Q 150 -40 420 -110" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" fill="none" class="flow-line" />
    <!-- Flying Airplane Group -->
    <g class="plane-path">
      <path d="M0 0 L15 -5 L30 0 L18 4 L14 14 L8 14 L11 4 L3 2 L0 5 L-3 5 L-1 1 Z" fill="#38bdf8" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Decorative Tech Nodes & Connecting Lines (Lower Right) -->
  <g stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 720 280 L 800 280 L 850 320" class="flow-line"/>
    <circle cx="720" cy="280" r="4" fill="#6366f1"/>
    <circle cx="800" cy="280" r="4" fill="#38bdf8"/>
    <circle cx="850" cy="320" r="4" fill="#818cf8"/>
  </g>

  <!-- Floating Feature Cards (Pill Badges) -->
  <g class="floating-card" transform="translate(740, 60)" filter="url(#shadow)">
    <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#34d399" />
    <text x="36" y="23" class="badge-text">A-CDM Real-Time</text>
  </g>

  <g class="floating-card-2" transform="translate(970, 260)" filter="url(#shadow)">
    <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="36" y="23" class="badge-text">AODB &amp; FIDS Suite</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Branding (Guaranteed non-overlapping & crystal clear) -->
  <!-- Left Accent Bar -->
  <rect x="70" y="95" width="6" height="170" rx="3" fill="url(#cyan-blue)" filter="url(#glow)" />

  <!-- Main Repository Category Badge -->
  <g transform="translate(96, 95)">
    <rect width="210" height="28" rx="14" fill="#312e81" fill-opacity="0.7" stroke="#6366f1" stroke-width="1"/>
    <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">AVIATION TECH ECOSYSTEM</text>
  </g>

  <!-- Header Title -->
  <text x="96" y="170" class="title-text" filter="url(#shadow)">
    Awesome Airport Operations
  </text>
  <text x="96" y="215" class="title-text" fill="url(#cyan-blue)">
    Management
  </text>

  <!-- Subtitle -->
  <text x="96" y="255" class="subtitle-text">
    Curated SaaS &amp; Open-Source Directory for AODB, FIDS, A-CDM &amp; Airside Optimization
  </text>
</svg>
